name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate Android project structure
        run: flutter create . --platforms=android --org com.storevisit.app

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android APK (Release)
        run: flutter build apk --release

      - name: Upload APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: store-visit-app-release
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
          tag_name: latest
          name: "Phiên bản Android APK mới nhất"
          body: |
            ### 📱 Tải ứng dụng Thăm Viếng Đúng Tuyến (Android APK)
            - **Tên file:** `app-release.apk`
            - **Nền tảng:** Android 7.0+ (Material 3)
            - **Giao diện:** 4 màn hình chuẩn Figma (Thăm viếng, FAB menu, Bottom sheet pin map, Hoạt động)
            
            Nhấn vào file **app-release.apk** đính kèm bên dưới để tải về điện thoại và cài đặt.
          draft: false
          prerelease: false
